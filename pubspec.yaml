name: sms_mms
description: Opens the native messaging app on Android and iOS with recipients, a message and attachments filled in. Skips the app chooser on Android.
version: 0.1.0
homepage: https://github.com/Manveer1999/flutter_sms_mms
repository: https://github.com/Manveer1999/flutter_sms_mms
issue_tracker: https://github.com/Manveer1999/flutter_sms_mms/issues
topics:
  - sms
  - mms
  - messaging
  - share

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.manveer1999.sms_mms
        pluginClass: SmsMmsPlugin
      ios:
        pluginClass: SmsMmsPlugin
